name: Patch DIO portfolio index

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dio-section.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Patch and verify index
        shell: bash
        run: python scripts/patch_dio_section.py

      - name: Commit change
        shell: bash
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "No change needed."
          else
            git add index.html
            git commit -m "Add DIO architecture spine to portfolio"
            git push
          fi
