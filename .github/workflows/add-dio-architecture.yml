name: Apply DIO disclosure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-dio-architecture.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply and verify
        run: python3 scripts/patch_dio_disclosure.py
      - name: Commit
        run: |
          git config user.name portfolio-site-bot
          git config user.email portfolio-site-bot@users.noreply.github.com
          git add index.html
          git commit -m "Collapse DIO architecture section"
          git push
