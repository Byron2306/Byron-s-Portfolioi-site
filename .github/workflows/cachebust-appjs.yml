name: Cache-bust portfolio app.js

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cachebust-appjs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cachebust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Version app.js reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<script defer src="app.js"></script>'
          new = '<script defer src="app.js?v=20260917-arda"></script>'
          if new in text:
              print('app.js already cache-busted')
          elif old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Updated app.js reference')
          else:
              raise SystemExit('app.js script tag not found')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "No change needed."
          else
            git add index.html
            git commit -m "Cache-bust portfolio app JavaScript"
            git push
          fi
