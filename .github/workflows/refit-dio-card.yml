name: Refit DIO card
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refit-dio-card.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: python scripts/refit_dio_card.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dio-section.css
          git commit -m "Refit DIO section as flagship card"
          git push
